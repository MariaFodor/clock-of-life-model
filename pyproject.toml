[project]
name = "clock-of-life-model"
version = "0.1.0"
description = "The Clock of Life — offline survival-model training pipeline. Emits a versioned artifact bundle for the Rust scoring service."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "lifelines>=0.30",
]

[project.scripts]
clock-train = "clock_model.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
